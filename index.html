<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบเฝ้าระวังทางระบาดวิทยา — สำนักงานสาธารณสุขจังหวัดลำพูน</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #065F46;
      --primary-dark: #022C22;
      --primary-light: #059669;
      --accent: #0D9488;
      --accent-subtle: #F0FDF4;
      --bg-topbar: #044E39;
      --bg-page: #0F172A;
      --card-bg: #FFFFFF;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08);
      --font-th: 'Sarabun', 'IBM Plex Sans Thai', sans-serif;
      --font-en: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-th);
      background: var(--bg-page);
      color: var(--text-dark);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    .master-header {
      background: linear-gradient(135deg, #022C22 0%, #065F46 55%, #047857 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      z-index: 100;
      flex-shrink: 0;
      border-bottom: 2px solid rgba(167, 243, 208, 0.25);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.25rem 0.35rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-logos {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-logo {
      height: 40px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }

    .brand-text p {
      font-size: 0.76rem;
      color: #A7F3D0;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34D399;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.38rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .action-btn.btn-office {
      background: #F59E0B;
      color: #0F172A;
      font-weight: 700;
      border: none;
    }

    .action-btn.btn-office:hover {
      background: #D97706;
      color: #FFFFFF;
    }

    /* 5 Core Module Navigation Tabs */
    .tab-bar {
      display: flex;
      align-items: stretch;
      padding: 0 0.85rem;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1;
      min-width: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.7rem 0.85rem;
      background: transparent;
      border: none;
      border-bottom: 3.5px solid transparent;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      font-family: var(--font-th);
      font-size: 0.92rem;
      font-weight: 600;
      transition: all 0.18s ease;
      position: relative;
    }

    .tab-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
    }

    .tab-btn.active {
      color: #FFFFFF;
      font-weight: 800;
      border-bottom-color: #FBBF24;
      background: rgba(255, 255, 255, 0.14);
    }

    .tab-icon {
      font-size: 1.2rem;
      display: inline-block;
      line-height: 1;
    }

    .tab-title {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .tab-name {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .tab-sub {
      font-size: 0.7rem;
      opacity: 0.85;
      font-family: var(--font-en);
      letter-spacing: 0.02em;
    }

    .tab-badge {
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      margin-left: auto;
      font-family: var(--font-en);
      white-space: nowrap;
    }

    .badge-surv { background: rgba(14, 165, 233, 0.25); color: #7DD3FC; border: 1px solid rgba(125, 211, 252, 0.3); }
    .badge-weekly { background: rgba(59, 130, 246, 0.25); color: #93C5FD; border: 1px solid rgba(147, 197, 253, 0.3); }
    .badge-tb { background: rgba(168, 85, 247, 0.25); color: #D8B4FE; border: 1px solid rgba(216, 180, 254, 0.3); }
    .badge-dengue { background: rgba(239, 68, 68, 0.25); color: #FCA5A5; border: 1px solid rgba(252, 165, 165, 0.3); }
    .badge-zoo { background: rgba(16, 185, 129, 0.25); color: #6EE7B7; border: 1px solid rgba(110, 231, 183, 0.3); }

    .tab-btn.active .tab-badge {
      background: #FFFFFF;
      color: #065F46;
      border-color: #FFFFFF;
    }

    /* Main Content Area: Iframes Container */
    .viewport-container {
      flex: 1;
      position: relative;
      background: #F1F5F9;
      overflow: hidden;
    }

    .module-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #FFFFFF;
    }

    .module-frame.active {
      display: block;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      border-left: 4px solid #10B981;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 1024px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
      }
      .header-actions {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
      }
      .tab-btn {
        min-width: 155px;
        padding: 0.55rem 0.65rem;
      }
    }
  </style>
</head>

  </div>

  <script>
    const MODULES = {
      'surv': { frame: 'frame-surv', tab: 'tab-surv', title: 'ระบบรายงานเฝ้าระวังทางระบาดวิทยา 55 โรค จ.ลำพูน (Wk41/2569)', url: 'surv55.html' },
      'weekly': { frame: 'frame-weekly', tab: 'tab-weekly', title: 'รายงานโรคเฝ้าระวัง จ.ลำพูน — สัปดาห์ที่ 41/2569', url: 'weekly.html' },
      'tb': { frame: 'frame-tb', tab: 'tab-tb', title: 'LPHO-TB Dashboard — สสจ.ลำพูน (อัปเดต W46 ปีงบ 2570 & สรุปปีงบ 2569)', url: 'tb.html' },
      'dengue': { frame: 'frame-dengue', tab: 'tab-dengue', title: 'LPHO–Dengue Intelligence Dashboard — สัปดาห์ที่ 46/2569', url: 'dengue.html' },
      'zoo': { frame: 'frame-zoo', tab: 'tab-zoo', title: 'LPHO One Health Zoonosis 2569 — สสจ. x ปศุสัตว์ x ทสจ.ลำพูน', url: 'zoonosis.html' }
    };

    let currentModule = 'surv';

    function switchModule(modKey, updateHash = true) {
      if (!MODULES[modKey]) return;
      currentModule = modKey;

      // Update Tabs
      Object.keys(MODULES).forEach(key => {
        const tabEl = document.getElementById(MODULES[key].tab);
        const frameEl = document.getElementById(MODULES[key].frame);
        if (key === modKey) {
          tabEl.classList.add('active');
          tabEl.setAttribute('aria-selected', 'true');
          frameEl.classList.add('active');
        } else {
          tabEl.classList.remove('active');
          tabEl.setAttribute('aria-selected', 'false');
          frameEl.classList.remove('active');
        }
      });

      if (updateHash) {
        history.replaceState(null, null, '#' + modKey);
      }
    }

    function copyCurrentLink() {
      const url = window.location.origin + window.location.pathname + '#' + currentModule;
      navigator.clipboard.writeText(url).then(() => {
        showToast('คัดลอกลิงก์ ' + MODULES[currentModule].title + ' สำเร็จ! (' + url + ')');
      }).catch(() => {
        showToast('ลิงก์: ' + url);
      });
    }

    function printActiveModule() {
      const activeFrame = document.getElementById(MODULES[currentModule].frame);
      if (activeFrame && activeFrame.contentWindow) {
        activeFrame.contentWindow.focus();
        activeFrame.contentWindow.print();
      } else {
        window.print();
      }
    }

    function openStandalone() {
      window.open(MODULES[currentModule].url, '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // Keyboard Shortcuts (1, 2, 3, 4, 5)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '1') switchModule('surv');
      if (e.key === '2') switchModule('weekly');
      if (e.key === '3') switchModule('tb');
      if (e.key === '4') switchModule('dengue');
      if (e.key === '5') switchModule('zoo');
    });

    // Hash Route on Load
    function checkHashRoute() {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (hash && MODULES[hash]) {
        switchModule(hash, false);
      } else if (hash === '55diseases' || hash === '55' || hash === 'surveillance') {
        switchModule('surv', false);
      }
    }

    window.addEventListener('DOMContentLoaded', checkHashRoute);
    window.addEventListener('hashchange', checkHashRoute);
  </script>
